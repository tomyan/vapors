# `cargo xtask <command>` runs the factory. `cargo xtask --help` lists every command.
[alias]
xtask = "run --quiet --package xtask --"

# Incremental compilation is off for every build, not only xtask's: an
# incremental target reached 104 GB on 2026-11-13 and, with ten worktrees
# building, filled the disk in 30 minutes. sccache needs it off too.
[build]
incremental = false
# Plain `cargo` builds 4 jobs at once, as xtask's steps do
# (xtask/src/priority.rs, DEFAULT_JOBS; a test holds the two together):
# three builders of 4 fill the dev machine's 12 threads
# (docs/plans/factory-throughput.md 2.2). The gate sets CARGO_BUILD_JOBS
# to every thread; CI's 4-core runners build 4 at once either way.
jobs = 4
