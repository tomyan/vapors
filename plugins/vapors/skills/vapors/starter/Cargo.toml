[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish = false

# Every vapors crate at one rev; keep the pin and keep them equal.
# Default features are off: complex-script-breaks (line breaking for
# Thai, Khmer and the like) adds 3 MB to the release wasm (8.5 to 5.5 MB).
[dependencies]
vapors-app = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5", default-features = false, features = ["grid"] }
vapors-elements = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5", default-features = false, features = ["grid"] }
vapors-platform = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5" }
vapors-scene3d = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5" }
vapors-scene3d-components = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5" }
vapors-scene3d-gpu = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5" }
vapors-signals = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5" }
vapors-text = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5", default-features = false }
rand = "0.10"
# rand's source of randomness; in the browser it needs the wasm_js feature
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
vapors-compiler = { git = "https://github.com/tomyan/vapors", rev = "b64d6bade7114ccc665882a321e2ddbcc156fcb5" }

# Debug builds are for iterating, so no debug info. With this and the
# default features off, the first debug build took 44 s rather than
# 52 s here (12 threads, 4 jobs).
[profile.dev]
debug = false
