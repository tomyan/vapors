# Per-repository settings for the factory (xtask). The xtask code is the
# same in every repository that uses it; what differs lives here.
# Shape: flat tables of `key = "value"`.

[screenshot]
# The packages whose examples and binaries `cargo xtask screenshot` runs,
# comma-separated; a target name must be in exactly one of them.
packages = "vapors-platform, vapors-app"

[web]
# The package `cargo xtask web` builds with trunk and the `wasm` CI step
# lints for wasm32-unknown-unknown.
package = "vapors-web-demo"

[serve]
# Where `cargo xtask serve` puts the release build of main (serve_config.rs):
# a copy under the home directory, at https `https` and `path` on the
# tailnet, after `check` (a shell line, in its own temporary directory,
# removed after) passes on the build within `check_seconds`. The demo
# page lives under /vapors/ so touche's page keeps /.
dir = "srv/vapors-demo"
https = "443"
path = "/vapors/"
check = "d=$(mktemp -d) && scripts/check-page-contract.sh target/web $d; s=$?; rm -rf $d; exit $s"
# The page contract took 41 s on the runner (run 40036623884, 2026-10-23);
# four times that, for a loaded box.
check_seconds = "180"

[dev]
# The https port `cargo xtask dev` serves trunk's debug page on, at /.
https = "8446"

[files]
# The file-length rule as a check (the `files` step of `lint` and `ci`).
# The rule says about 200; 220 leaves room for a module doc comment and
# a test-module mount without forcing a split that would only move lines.
max_lines = "220"

# Files allowed over the limit, each with its reason. `cargo xtask check-files`
# and `lint --verbose` print them; the `files` step shows only refusals.
[files.allow]

# Files not written by hand; left out of the check.
[files.generated]

# `[layers.forbid]` maps a crate to crates it must never depend on,
# directly or through others, by normal or build dependencies
# (`cargo xtask check-layers`, the `layers` step of lint and ci). vapors
# sets none; touche keeps its document, engine and runtime clear of UI
# crates.

# `[gate] twin` names a sibling checkout whose xtask must equal this
# one's (xtask/src/gate_twin.rs). vapors sets none: xtask changes land
# here first, and touche's gate checks its copy against vapors at its pin.

# `cargo xtask gate` runs every `run` step of .github/workflows/ci.yml, as
# CI runs it, except these: the runner's setup, which a worktree already
# has. Each is an exact line of a step's script, with its reason; a step
# all of whose lines are listed is not run.
[gate.setup]
# The apt-install action's runner-only steps (.github/actions/apt-install):
# the cache key needs the runner image's variables, and the install runs
# apt as root. Literal keys ('...') hold lines with double quotes.
'[ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ] || { echo "::error::ImageOS or ImageVersion is unset; the apt cache key needs the runner image"; exit 1; }' = "apt cache key: needs the runner image's ImageOS and ImageVersion"
'echo "key=apt-$ImageOS-$ImageVersion-$(printf %s "$PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"' = "apt cache key: written for actions/cache"
'archives="$HOME/.cache/apt-archives"' = "apt install: where the cached .debs live on the runner"
'mkdir -p "$archives/partial"' = "apt install: the cache directory"
"sudo apt-get update -q" = "apt install: the runner's package lists"
"# shellcheck disable=SC2086 # the list is split into packages on purpose" = "apt install: a comment line in the step"
'sudo apt-get install -y -q -o Dir::Cache::Archives="$archives" -o APT::Keep-Downloaded-Packages=true $PACKAGES' = "apt install: as root, keeping the .debs"
'sudo chown -R "$(id -u):$(id -g)" "$archives"' = "apt install: the .debs back to the runner's user for the cache"
'echo "$(ls "$archives"/*.deb 2>/dev/null | wc -l) .debs kept for the cache"' = "apt install: how many .debs are cached"
"rustup toolchain install && rustup show active-toolchain" = "the toolchain, from rust-toolchain.toml"
"cargo xtask setup --ci" = "the pinned tools, installed once per machine"

[gate.actions]
"actions/cache" = "restores the apt .debs on the runner; the apt steps are runner setup here"
"actions/checkout" = "the gate runs in a checkout of this repository"
"Swatinem/rust-cache" = "a cache of target/; the local target directory is already there"
"cargo-bins/cargo-binstall" = "installs cargo-binstall, which cargo xtask setup --ci needs; that line is setup"
"actions/upload-artifact" = "uploads files for people to read; nothing is checked"

# web_sys, the browser's API, only in the platform layer; every other
# crate reaches the browser through vapors-platform
# (`cargo xtask check-imports`, the `imports` step).
[imports.web_sys]
"crates/platform/" = "vapors-platform: the window, input and file picker on the web"
