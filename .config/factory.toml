# Per-repository settings for the factory (xtask). The xtask code is the
# same in every repository that uses it; what differs lives here.
# Shape: flat tables of `key = "value"`.

[screenshot]
# The packages whose examples and binaries `cargo xtask screenshot` runs,
# comma-separated; a target name must be in exactly one of them.
packages = "vapors-platform, vapors-app"

[web]
# The package `cargo xtask web` builds with trunk and the `wasm` CI step
# lints for wasm32-unknown-unknown.
package = "vapors-web-demo"

[files]
# The file-length rule as a check (the `files` step of `lint` and `ci`).
# The rule says about 200; 220 leaves room for a module doc comment and
# a test-module mount without forcing a split that would only move lines.
max_lines = "220"

# Files allowed over the limit, each with its reason. `cargo xtask check-files`
# and `lint --verbose` print them; the `files` step shows only refusals.
[files.allow]

# Files not written by hand; left out of the check.
[files.generated]

# `cargo xtask gate` runs every `run` step of .github/workflows/ci.yml, as
# CI runs it, except these: the runner's setup, which a worktree already
# has. Each is an exact line of a step's script, with its reason; a step
# all of whose lines are listed is not run.
[gate.setup]
"sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk && fc-list :lang=zh | head -1" = "apt: the CJK font for the fallback test, and its check"
"sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools && vulkaninfo --summary | grep -E 'deviceName|driverName'" = "apt: lavapipe, and the device it gives"
"sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev" = "apt: lavapipe, Xvfb and winit's X11 libraries"
"rustup toolchain install && rustup show active-toolchain" = "the toolchain, from rust-toolchain.toml"
"cargo xtask setup --ci" = "the pinned tools, installed once per machine"
