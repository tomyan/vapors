# Per-repository settings for the factory (xtask). The xtask code is the
# same in every repository that uses it; what differs lives here.
# Shape: flat tables of `key = "value"`.

[screenshot]
# The package whose examples and binaries `cargo xtask screenshot` runs.
package = "vapors-platform"

[web]
# The package `cargo xtask web` builds with trunk and the `wasm` CI step
# lints for wasm32-unknown-unknown.
package = "vapors-web-demo"

[files]
# The file-length rule as a check (the `files` step of `lint` and `ci`).
# The rule says about 200; 220 leaves room for a module doc comment and
# a test-module mount without forcing a split that would only move lines.
max_lines = "220"

# Files allowed over the limit, each with its reason, printed by the check.
[files.allow]

# Files not written by hand; left out of the check.
[files.generated]
