# Test runner settings. Every test has a deadline; a test that hangs is
# killed and reported, never waited on. Retries are off: a test that
# fails intermittently is a bug to fix, not a result to re-roll.
#
# The 30s period is a starting value; it is replaced by a number from the
# timing reports gathered in slice S1 (see docs/budgets.md once it exists).
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 2 }

# The compile-fail fixtures (crates/compiler-examples/tests/compile_fail.rs)
# run as one trybuild run, which builds compiler-examples and all its
# dependencies and dev-dependencies (vapors-elements, vapors-text, ...) in
# its own target/tests/trybuild, so it cannot reuse the test build's
# artifacts: a gate's cold target pays for that build. Measured cold, 12
# cores: 152.4 s at load 3.0 (a fresh worktree, sccache, 2026-11-27) and
# 174.9 s in #638's gate at load 3.5; 46.9 s with only its own target
# cold; 0.4 s warm. Five minutes is 1.7 times the slowest; a gate under
# heavier load than these is unmeasured, and would fail here, naming it.
[[profile.default.overrides]]
filter = 'package(vapors-compiler-examples) & binary(compile_fail)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'package(vapors-compiler-examples) & binary(compile_fail)'
slow-timeout = { period = "60s", terminate-after = 5 }
