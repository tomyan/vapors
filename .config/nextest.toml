# Test runner settings. Every test has a deadline; a test that hangs is
# killed and reported, never waited on. Retries are off: a test that
# fails intermittently is a bug to fix, not a result to re-roll.
#
# The 30s period is a starting value; it is replaced by a number from the
# timing reports gathered in slice S1 (see docs/budgets.md once it exists).
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 2 }

# The compile-fail fixture (crates/compiler-examples/tests/must_use.rs)
# builds its own crate on a cold target: 52.9 s measured at load 33,
# 0.4 s warm. Four minutes leaves room for a gate's cold build under load.
[[profile.default.overrides]]
filter = 'package(vapors-compiler-examples) & binary(must_use)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'package(vapors-compiler-examples) & binary(must_use)'
slow-timeout = { period = "60s", terminate-after = 4 }
