# Pinned versions of the tools the factory runs. `cargo xtask setup`
# installs them and `cargo xtask ci` checks them. Bumping a version is a
# deliberate pull request. Shape: `[tools]` maps crate to version;
# `[binaries]` maps a crate to its binary name where they differ.
[tools]
cargo-nextest = "0.9.149"
cargo-deny = "0.20.2"
trunk = "0.22.0"
wasm-bindgen-cli = "0.2.129"
bacon = "3.26.0"
# Every build xtask starts compiles through it (xtask/src/sccache.rs).
sccache = "0.18.0"
# `cargo xtask serve` runs it behind tailscale serve: the release page
# with brotli and gzip copies, and its cache headers (serve_static.rs).
static-web-server = "2.44.1"

[binaries]
wasm-bindgen-cli = "wasm-bindgen"

[checksums]
# The x86_64-unknown-linux-gnu release binary binstall installs (taken
# 2026-10-26 on the dev box): a tool that serves pages is held to it.
static-web-server = "4b39efe44e995bfb1a19517079046490ccc9b4e9907bf924ec46bef3197be56b"
