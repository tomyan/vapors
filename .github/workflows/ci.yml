# CI runs exactly one factory command. Anything CI checks, `cargo xtask ci`
# checks locally the same way.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read-only: the timeout report reads its own job's steps.
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NEXTEST_PROFILE: ci

# bash -eo pipefail for every run step (`shell: bash`; with no shell CI
# runs `bash -e`), as `cargo xtask gate` runs them, which it checks.
defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    # About 2.5x the job's worst measured, cold: 1149 s (2.5x is 47.9
    # minutes). Run 45361157497, attempt 1 (2026-11-24, #624, no Rust
    # cache), ran every step, unit 662 s, host 3.5 s (failing on the
    # runner; never timed passing there). Run 45076354761 (2026-11-22)
    # took 1080 s with unit 648 s and no Chromium warm-up (worst 49 s, run
    # 45084188329) or host. A faster cold run, 45283781763 (main a4bb9c63), reached the
    # end of unit in 733 s: unit's build 351 s, its tests 112 s. Warm, the
    # job took 634 s (45142856208): the cache holds dependencies, and every
    # workspace crate still builds, at opt-level 1 since #233 (2026-11-12),
    # when lint and unit went from 282 s (run 43218588943) to 439 s (run
    # 43227249253, cancelled) and past the old 9 minutes (2.5x 198 s, to
    # 2026-10-23). `cargo xtask gate` takes its ci-step deadline from this.
    timeout-minutes: 48
    env:
      # A CJK system font is installed below, so the system-font fallback
      # test must find one; it fails loudly rather than passing by luck.
      VAPORS_SYSTEM_FONTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step timeout: about 2.5x the worst measured, rounded up to a minute.
      # Over 13 runs with #626 that installed this list (2026-11-24 to 25): a
      # cache hit took 12 to 32 s (23 s on average), a miss 12 to 34 s (run
      # 45457321390). A hit saves the download, not the unpacking, so it is
      # not reliably faster. apt-install saves the .debs inside this limit
      # (1 to 3 s, run 45361157497). Not counted: one miss stalled on the
      # mirror and was killed at the old 1-minute limit (run 40036716064),
      # so how long it would have taken is unknown.
      # No bubblewrap (Tom, 2026-11-25): nothing in this job runs bwrap on
      # the runner. The SDK harness's tests that did are out of the host
      # tier. The host tier's two gate tests, on a machine with no render
      # node (the runner), check the NoRenderNode path: one asserts it, the
      # other runs its step under plain bash. The unit tier's tests use
      # fake bwraps. Where there is a render node the gate still refuses to
      # run without bwrap (gate_sandbox.rs), so a runner image with a
      # renderD* node would fail the host step, naming bubblewrap.
      - name: install a CJK system font for the fallback test
        timeout-minutes: 2
        uses: ./.github/actions/apt-install
        with:
          packages: fonts-noto-cjk
      - name: the CJK font is there
        run: |
          fc-list :lang=zh | head -1 | grep . || { echo "::error::no CJK font after the install; fix: check the apt-install step"; exit 1; }
      # rustup reads rust-toolchain.toml: channel, components, targets. One pin.
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      # cache-on-failure: a job that fails still saves what it compiled. One
      # killed at its own timeout does not: the post step that saves never
      # runs (run 45072756560). Without it the cache saved 2026-11-12 went stale when the
      # environment hash changed (cdee7d24 to c7ddb2ea), every later run
      # restored nothing ("No cache found"), timed out cold, and saved nothing:
      # ci cancelled in unit on main and in #602 (run 45067990897, twice);
      # gpu tier 10m56 cold against 3m40 warm (run 43204069045).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.1, committed 2026-10-24
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      # Advisories, bans, licences and sources by deny.toml; it fetches the
      # advisory database every run and fails if it cannot.
      - name: dependencies (cargo-deny)
        run: cargo xtask deny
      # Three steps rather than one `&&` line so the gate log and CI time
      # each; a failure skips the rest, as `&&` did.
      - name: lint
        run: cargo xtask lint
      - name: wasm lint
        run: cargo xtask wasm
      # The unit tier launches Chromium (gui-bench-app's chart oracle), as
      # the gpu job's tier does; the same warm-up as there. Without it the
      # first unit run to finish since 2026-11-12 (run 45076354761) failed
      # three chart tests at the 20 s screenshot deadline on the runner's
      # cold first launch. No hosted tier reads a hardware counter: those
      # tests are in the pmu tier (#612), which no job here runs.
      - name: warm headless Chromium
        run: cargo run -p vapors-text --example warm_chromium
      - name: unit
        run: cargo xtask test --tier unit
      # The host_ tests: run here and in the gate, never in an API builder's
      # sandbox (xtask/src/steps_tiers.rs HOST_TESTS). Here they are the
      # gate's two bwrap tests; with no render node on the runner, each
      # checks the NoRenderNode path, without bwrap. The private SDK
      # harness's host tests are not in this tier (SDK_HARNESS_TESTS, Tom
      # 2026-11-25): on GitHub's runner AppArmor refuses their bwrap user
      # namespace (run 45482514993), and changing that is not authorised
      # (Tom, 2026-11-23). `cargo xtask test --tier sdk-host` runs them.
      - name: host
        run: cargo xtask test --tier host
      # Bins and examples only: the unit step's nextest built the test
      # targets in the test profile, and --all-targets built them again in
      # dev, 85 % of this step's CPU (docs/plans/factory-throughput.md C1).
      - name: build timings
        if: always()
        run: cargo build --workspace --bins --examples --timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: timings
          path: |
            target/cargo-timings/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 48
        run: .github/scripts/report-timeout.sh

  web:
    name: web
    runs-on: ubuntu-24.04
    # 11 minutes: 1.5x the slowest each of the job's steps has taken on
    # the loaded dev machine, where the gate runs them, 414 s: setup 36 s
    # (below), trunk 114 s (gate-v243.log), the page contract 250 s
    # (gate-batch-271.log, load 17 to 26), the waker 12 s (gate-v213.log)
    # and the upload 2 s. The logs are the lead's, in ~/.cache/handoffs,
    # not in this repository; docs/plans/factory-throughput.md 1.1 and
    # 1.3 has the page contract's. Before that it was
    # 1.5x the slowest cold job, 232 s, rounded up to 6 minutes. A cold
    # job is one whose Rust cache missed (a dependency bump, or the first
    # run after a cancelled one, which saves no cache). Run 40751344696 (attempt 2, skrifa 0.49) was
    # cancelled at the old 3-minute limit 3 min 50 s after it started,
    # inside the waker step: setup 36 s, trunk build 118 s, page contract
    # 71 s, so with the waker's 5 s (run 40596652427) and the upload's 2 s
    # it needs about 232 s. Run 40596652427 attempt 1, cold too, was
    # cancelled the same way with a 105 s trunk build. With a warm cache
    # the job takes 150 s (run 40461186820, 2 min 30 s) and 47 s
    # before the page contract grew (run 39930654120).
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.1, committed 2026-10-24
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      - name: build the web demo with trunk
        run: cargo xtask web
      # The runner image ships google-chrome; the script picks $CHROME,
      # else google-chrome, else chromium, and fails naming the case. It
      # sets Chrome's own SwiftShader Vulkan driver: with lavapipe the
      # canvas composites white (run 39934974057).
      - name: page contract in headless Chrome
        run: scripts/check-page-contract.sh target/web "$(mktemp -d)"
      # The waker on the page: none idle, one frame per wake.
      - name: the waker in headless Chrome
        run: scripts/web-wake-frames.sh target/web "$(mktemp -d)"
      # The GPU-time readout's row at a phone's 412 x 915: shown in full,
      # the canvas filling the rest (#491).
      - name: the readout row in headless Chrome
        run: scripts/web-readout-row.sh target/web "$(mktemp -d)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: target/web
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 11
        run: .github/scripts/report-timeout.sh

  gpu:
    name: gpu
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    # Software rendering (Lavapipe on the runner's CPU), not a GPU. About
    # 2.5x the job's worst, 1016 s, summed from each step's worst over the
    # 40 ci runs to 2026-11-24 and two cold diag runs: the gpu tier 628 s
    # (run 45175872545; with no Rust cache, run 45360772923 built its
    # tests in 371 s and ran them in 94 s, 45358442696 built them in 467
    # s); text comparison, the a11y oracle and the text input 41 s (11 s
    # and 3 s, run 45349685941; 27 s, 45361157497); the lavapipe step at
    # its own 2-minute limit, 120 s; setup, toolchain, tools and the
    # Chromium warm-up 173 s (warm-up 85 s, 45231501868); uploads, the
    # cache save and the post steps 54 s (cache save 47 s, 45349685941).
    # #625 set 49 minutes from 1155 s, which also counted the layout and
    # events oracle steps (107 s, 45349685941; 28 s, 45153700689); this
    # job no longer runs them. (#625 gave those five steps 180 s; their
    # worsts sum to 176 s, so 1155 less the two is 1020, not 1016; either
    # gives 43 minutes.) The old 13 minutes (2.5x 303 s, run
    # 41349572659) predates #233's opt-level 1 test builds (2026-11-12):
    # the tier has taken up to 628 s since. `cargo xtask gate` takes its
    # local deadline for this job's steps from this value too.
    timeout-minutes: 43
    # The web job's build, for the page's text input check below; the gate
    # runs jobs in file order in one worktree, so web's target/web is there.
    needs: web
    # The gpu tier, screenshots and the a11y oracle still run when the web job
    # fails; the text input step then refuses, naming the web job.
    if: ${{ !cancelled() }}
    env:
      # lavapipe is the CI reference adapter; the tier fails if it is not the one found.
      VAPORS_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step timeout: about 2.5x the worst measured, rounded up to a minute.
      # Over 19 runs with #626 (2026-11-24 to 25): a cache hit took 12 to 38 s
      # (23 s on average, worst run 45489378697), a miss 14 to 36 s.
      # apt-install saves the .debs inside this limit (1 to 3 s, run
      # 45361157497).
      - name: install lavapipe
        timeout-minutes: 2
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers vulkan-tools
          mesa-major: 25 # 25.2.8 on ubuntu-24.04, 2026-10-23
      - name: lavapipe is the Vulkan device
        run: |
          devices=$(vulkaninfo --summary)
          printf '%s\n' "$devices" | grep -E 'deviceName|driverName'
          case $devices in *llvmpipe*) ;; *) echo "::error::no llvmpipe device after installing lavapipe; fix: check the install step and mesa-major"; exit 1 ;; esac
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      # cache-on-failure: a job that fails still saves what it compiled. One
      # killed at its own timeout does not: the post step that saves never
      # runs (run 45072756560). Without it the cache saved 2026-11-12 went stale when the
      # environment hash changed (cdee7d24 to c7ddb2ea), every later run
      # restored nothing ("No cache found"), timed out cold, and saved nothing:
      # ci cancelled in unit on main and in #602 (run 45067990897, twice);
      # gpu tier 10m56 cold against 3m40 warm (run 43204069045).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.1, committed 2026-10-24
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      # The browser's first launch on a fresh runner took 15.3 to 57.9 s, past
      # the tests' 20 s screenshot deadline, which assumes a warm one; see
      # COLD_START in crates/text/src/comparison/chromium_warm.rs.
      - name: warm headless Chromium
        run: cargo run -p vapors-text --example warm_chromium
      - name: gpu tier
        run: cargo xtask test --tier gpu
      # The text comparison page: vapors-text beside headless Chrome (the
      # runner image ships google-chrome), composite uploaded for eyes.
      - name: text comparison page
        run: cargo run -p vapors-text --example text_comparison -- --out target
      # The layout and events oracles' answers (fixtures/*.boxes.json and
      # *.events.json) are held to vapors by the unit tier, with no browser
      # (corpus.rs, events_every_script.rs, committed_references.rs); they
      # are checked against Chromium on request with the oracles' --check
      # (Tom, 2026-11-23).
      # The a11y oracle: Chromium's accessibility tree for every fixture,
      # read over the DevTools protocol, must match fixtures/*.ax.json.
      # It stays live here: no vapors test reads *.ax.json yet, so this is
      # their only check (Tom, 2026-11-23); a vapors comparison retires it.
      - name: a11y oracle against the runner's Chrome
        run: cargo run -p vapors-elements-corpus --example ax_oracle -- --check
      # The page's text input (E6): typed text, an IME's composition and
      # keys on Chromium's own <input> and on the web job's built page,
      # the field's text and selection equal after each step.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: target/web
      - name: the page's text input against Chromium's <input>
        # also after a failed download, where it refuses, naming the web
        # job; not after a cancel (the job's timeout), within its grace
        if: ${{ !cancelled() }}
        run: scripts/web-text-input.sh target/web "$(mktemp -d)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: text-comparison
          path: |
            target/text_comparison*.png
            target/tmp/paint_*.png
          if-no-files-found: error
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 43
        run: .github/scripts/report-timeout.sh

  window:
    name: window
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    # About 2.5x the worst measured run plus the live_timer step. The
    # slowest of 41 passing window jobs from 2026-11-25 to 27 took 229 s
    # (run 45915289797, a partial rust-cache miss: a restore-key fallback
    # that left the first screenshot step at 80 s and surface_gradient's
    # at 59 s, both mostly compiling; a full miss is not measured). The
    # live_timer step took 4 s passing (run 45923046475) and 5 s failing
    # at a deliberate break after its full 3.4 s check (run 45922653681).
    # 2.5 x 234 s = 585 s, rounded up to 10 minutes. The uncached 733 s
    # apt install in run 39803145234 is excluded: it is the slow mirror
    # the cache avoids. Earlier limit cleared by Tom on 2026-11-10.
    timeout-minutes: 10
    env:
      VAPORS_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step timeout: about 2.5x the worst measured, rounded up to a minute.
      # Over 20 runs with #626 (2026-11-24 to 25), all cache hits: 13 to 46 s
      # (25 s on average, worst run 45457321390). The worst miss measured is
      # 52 s (run 40030067596, 2026-10-23). apt-install saves the .debs
      # inside this limit (1 to 3 s, run 45361157497).
      - name: install lavapipe, Xvfb and winit's X11 libraries
        timeout-minutes: 3
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers xvfb xclip libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          mesa-major: 25 # 25.2.8 on ubuntu-24.04, 2026-10-23
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.1, committed 2026-10-24
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      - name: screenshot of the clear window
        run: cargo xtask screenshot clear_window target/clear_window.png --expect 12,200,34
      # The waker in a window: none idle, one frame per wake from a thread.
      - name: the waker in a window
        run: xvfb-run -a cargo run -p vapors-platform --example wake_window
      # A gpu-surface renderer mounted on an ElementsApp: no frame and no
      # render while idle, one render per invalidate, a render every frame
      # while animation is requested with one frame without a render (the
      # wake frame), none after stop_animation, and an invalidate after
      # the loop is LoopClosed. Step text cleared by Tom 2026-11-10.
      - name: a gpu-surface in a window, idle, invalidated, animating and stopped
        run: xvfb-run -a cargo run -p vapors-app --example surface_gradient -- --check
      # The Live timer on the application thread (desktop-app-thread.md,
      # L1b): handlers, toggles and ticks on that thread, no frame before
      # Live goes on and at most one (a tick on its way, within a period)
      # after it goes off, no turns then beyond the script's, no ticks
      # after off, one frame per tick within 50 ms, 80 to 120 ms between
      # ticks, and no frame that shows nothing new. Its own watchdog ends
      # a hung run at 15 s.
      - name: the Live timer on the application thread, in a window
        run: xvfb-run -a cargo run -p vapors-app --example live_timer -- --check
      # The clipboard's image for Event::Paste: a PNG xclip sets reads
      # back as its pixels, text alone as no image, an unreachable
      # display as unreadable.
      - name: the clipboard's image under Xvfb
        run: xvfb-run -a cargo run -p vapors-platform --example check_clipboard
      - name: screenshot of the gradient fixture, fitted
        run: cargo xtask screenshot image_window target/image_window.png --expect 128,128,128 -- --open crates/platform/examples/fixtures/gradient.png
      # Each F2c demo in a window; the example holds the screenshot to the
      # demo's crates/demos/demos/<name>.pixels and exits 1 on a miss.
      - name: screenshot of the hello demo (F2c S1)
        run: cargo xtask screenshot demo target/hello.png --expect 23,27,31 -- hello
      # The example clicks the button as counter.pixels lists, then checks.
      - name: screenshot of the counter demo after a click (F2c S2)
        run: cargo xtask screenshot demo target/counter.png -- counter
      - name: screenshot of the boxes demo (F2c S3)
        run: cargo xtask screenshot demo target/boxes.png -- boxes
      - name: screenshot of the shell demo (F2c S4)
        run: cargo xtask screenshot demo target/shell.png -- shell
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: target/*.png
          if-no-files-found: ignore
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 10
        run: .github/scripts/report-timeout.sh
