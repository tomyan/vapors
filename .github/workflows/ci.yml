# CI runs exactly one factory command. Anything CI checks, `cargo xtask ci`
# checks locally the same way.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NEXTEST_PROFILE: ci

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    timeout-minutes: 30 # initial ceiling; docs/budgets.md holds the measured value
    env:
      # A CJK system font is installed below, so the system-font fallback
      # test must find one; it fails loudly rather than passing by luck.
      VAPORS_SYSTEM_FONTS: 1
    steps:
      - uses: actions/checkout@v7
      - name: install a CJK system font for the fallback test
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk && fc-list :lang=zh | head -1
      # rustup reads rust-toolchain.toml: channel, components, targets. One pin.
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: install pinned tools
        run: cargo xtask setup --ci
      - name: lint, wasm lint and unit
        run: cargo xtask lint && cargo xtask wasm && cargo xtask test --tier unit
      - name: build timings
        if: always()
        run: cargo build --workspace --all-targets --timings
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings
          path: |
            target/cargo-timings/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: install pinned tools
        run: cargo xtask setup --ci
      - name: build the web demo with trunk
        run: cargo xtask web
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: target/web

  gpu:
    name: gpu
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    timeout-minutes: 30
    env:
      # lavapipe is the CI reference adapter; the tier fails if it is not the one found.
      VAPORS_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@v7
      - name: install lavapipe
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools && vulkaninfo --summary | grep -E 'deviceName|driverName'
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: install pinned tools
        run: cargo xtask setup --ci
      - name: gpu tier
        run: cargo xtask test --tier gpu
      # The text comparison page: vapors-text beside headless Chrome (the
      # runner image ships google-chrome), composite uploaded for eyes.
      - name: text comparison page
        run: cargo run -p vapors-text --example text_comparison -- --out target
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: text-comparison
          path: target/text_comparison*.png
          if-no-files-found: error

  window:
    name: window
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    timeout-minutes: 30
    env:
      VAPORS_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@v7
      - name: install lavapipe, Xvfb and winit's X11 libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: install pinned tools
        run: cargo xtask setup --ci
      - name: screenshot of the clear window
        run: cargo xtask screenshot clear_window target/clear_window.png --expect 12,200,34
      - name: screenshot of the gradient fixture, fitted
        run: cargo xtask screenshot image_window target/image_window.png --expect 128,128,128 -- --open crates/platform/examples/fixtures/gradient.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: target/*.png
          if-no-files-found: ignore
