# CI runs exactly one factory command. Anything CI checks, `cargo xtask ci`
# checks locally the same way.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read-only: the timeout report reads its own job's steps.
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NEXTEST_PROFILE: ci

# bash -eo pipefail for every run step (`shell: bash`; with no shell CI
# runs `bash -e`), as `cargo xtask gate` runs them, which it checks.
defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    # About 2.5x (the job's worst without its apt step in the 37 runs to
    # 2026-10-23, 185 s in run 39807737788, plus that step's worst with
    # the cache, 13 s in run 39932437148). The uncached 1811 s install in
    # run 39803408769 is excluded: it is the slow mirror the cache avoids.
    timeout-minutes: 9
    env:
      # A CJK system font is installed below, so the system-font fallback
      # test must find one; it fails loudly rather than passing by luck.
      VAPORS_SYSTEM_FONTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step timeout: about 2.5x the worst measured, rounded up to a minute.
      # Over the last 40 runs (2026-10-23): a cache miss took 12 to 35 s
      # (run 40031283392), a hit 13 s on average and 21 s at worst. One miss
      # stalled on the mirror past the old 1-minute limit (run 40036716064).
      - name: install a CJK system font for the fallback test
        timeout-minutes: 2
        uses: ./.github/actions/apt-install
        with:
          packages: fonts-noto-cjk
      - name: the CJK font is there
        run: |
          fc-list :lang=zh | head -1 | grep . || { echo "::error::no CJK font after the install; fix: check the apt-install step"; exit 1; }
      # rustup reads rust-toolchain.toml: channel, components, targets. One pin.
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.0, main on 2026-10-23
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      # Advisories, bans, licences and sources by deny.toml; it fetches the
      # advisory database every run and fails if it cannot.
      - name: dependencies (cargo-deny)
        run: cargo xtask deny
      - name: lint, wasm lint and unit
        run: cargo xtask lint && cargo xtask wasm && cargo xtask test --tier unit
      - name: build timings
        if: always()
        run: cargo build --workspace --all-targets --timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: timings
          path: |
            target/cargo-timings/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 9
        run: .github/scripts/report-timeout.sh

  web:
    name: web
    runs-on: ubuntu-24.04
    # About 2.5x the job's worst without an apt step, which it no longer
    # has (#27), in the 37 runs to 2026-10-23: 69 s in run 39805979396.
    # With the Rust cache it took 47 s (run 39930654120).
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.0, main on 2026-10-23
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      - name: build the web demo with trunk
        run: cargo xtask web
      # The runner image ships google-chrome; the script picks $CHROME,
      # else google-chrome, else chromium, and fails naming the case. It
      # sets Chrome's own SwiftShader Vulkan driver: with lavapipe the
      # canvas composites white (run 39934974057).
      - name: page contract in headless Chrome
        run: scripts/check-page-contract.sh target/web "$(mktemp -d)"
      # The waker on the page: none idle, one frame per wake.
      - name: the waker in headless Chrome
        run: scripts/web-wake-frames.sh target/web "$(mktemp -d)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: target/web
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 3
        run: .github/scripts/report-timeout.sh

  gpu:
    name: gpu
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    # About 2.5x (the job's worst without its apt step in the 37 runs to
    # 2026-10-23, 199 s in run 39802585212, plus that step's worst with
    # the cache, 16 s in run 39930654120). The uncached 1812 s install in
    # run 39801264114 is excluded: it is the slow mirror the cache avoids.
    timeout-minutes: 9
    env:
      # lavapipe is the CI reference adapter; the tier fails if it is not the one found.
      VAPORS_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step timeout: about 2.5x the worst measured, rounded up to a minute.
      # Over the last 40 runs (2026-10-23): a cache miss took 10 to 11 s,
      # a hit 14 s on average and 32 s at worst (run 40028433485).
      - name: install lavapipe
        timeout-minutes: 2
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers vulkan-tools
          mesa-major: 25 # 25.2.8 on ubuntu-24.04, 2026-10-23
      - name: lavapipe is the Vulkan device
        run: |
          devices=$(vulkaninfo --summary)
          printf '%s\n' "$devices" | grep -E 'deviceName|driverName'
          case $devices in *llvmpipe*) ;; *) echo "::error::no llvmpipe device after installing lavapipe; fix: check the install step and mesa-major"; exit 1 ;; esac
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.0, main on 2026-10-23
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      # The browser's first launch on a fresh runner took 15.3 to 57.9 s, past
      # the tests' 20 s screenshot deadline, which assumes a warm one; see
      # COLD_START in crates/text/src/comparison/chromium_warm.rs.
      - name: warm headless Chromium
        run: cargo run -p vapors-text --example warm_chromium
      - name: gpu tier
        run: cargo xtask test --tier gpu
      # The text comparison page: vapors-text beside headless Chrome (the
      # runner image ships google-chrome), composite uploaded for eyes.
      - name: text comparison page
        run: cargo run -p vapors-text --example text_comparison -- --out target
      # The layout corpus's oracle: Chromium's boxes for every fixture must
      # equal the committed fixtures/*.boxes.json, or a fixture was edited
      # without rerunning the oracle, or Chrome lays it out differently.
      - name: layout oracle against the runner's Chrome
        run: cargo run -p vapors-elements-corpus --example layout_oracle -- --check
      # The a11y oracle: Chromium's accessibility tree for every fixture,
      # read over the DevTools protocol, must match fixtures/*.ax.json.
      - name: a11y oracle against the runner's Chrome
        run: cargo run -p vapors-elements-corpus --example ax_oracle -- --check
      # The events oracle: each fixture's .events script played in Chromium
      # over the DevTools protocol; its expectations must hold and its
      # answers match fixtures/*.events.json.
      - name: events oracle against the runner's Chrome
        run: cargo run -p vapors-elements-corpus --example events_oracle -- --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: text-comparison
          path: |
            target/text_comparison*.png
            target/tmp/paint_*.png
          if-no-files-found: error
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 9
        run: .github/scripts/report-timeout.sh

  window:
    name: window
    runs-on: ubuntu-24.04 # pinned: a runner image change changes Mesa and so the screenshots
    # About 2.5x (the job's worst without its apt step in the 37 runs to
    # 2026-10-23, 103 s in run 39807737788, plus that step's worst with
    # the cache, 13 s in run 39932437148). The uncached 733 s install in
    # run 39803145234 is excluded: it is the slow mirror the cache avoids.
    timeout-minutes: 5
    env:
      VAPORS_GPU_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step timeout: about 2.5x the worst measured, rounded up to a minute.
      # Over the last 40 runs (2026-10-23): a cache miss took 10 to 52 s
      # (run 40030067596), a hit 15 s on average and 21 s at worst.
      - name: install lavapipe, Xvfb and winit's X11 libraries
        timeout-minutes: 3
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers xvfb xclip libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          mesa-major: 25 # 25.2.8 on ubuntu-24.04, 2026-10-23
      - name: install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.0, main on 2026-10-23
      - name: install pinned tools
        # binstall reads GitHub's API; unauthenticated, it was refused
        # with 403 (run 40029521532). The token is read-only.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup --ci
      - name: screenshot of the clear window
        run: cargo xtask screenshot clear_window target/clear_window.png --expect 12,200,34
      # The waker in a window: none idle, one frame per wake from a thread.
      - name: the waker in a window
        run: xvfb-run -a cargo run -p vapors-platform --example wake_window
      # The clipboard's image for Event::Paste: a PNG xclip sets reads
      # back as its pixels, text alone as no image, an unreachable
      # display as unreadable.
      - name: the clipboard's image under Xvfb
        run: xvfb-run -a cargo run -p vapors-platform --example check_clipboard
      - name: screenshot of the gradient fixture, fitted
        run: cargo xtask screenshot image_window target/image_window.png --expect 128,128,128 -- --open crates/platform/examples/fixtures/gradient.png
      # Each F2c demo in a window; the example holds the screenshot to the
      # demo's crates/demos/demos/<name>.pixels and exits 1 on a miss.
      - name: screenshot of the hello demo (F2c S1)
        run: cargo xtask screenshot demo target/hello.png --expect 23,27,31 -- hello
      # The example clicks the button as counter.pixels lists, then checks.
      - name: screenshot of the counter demo after a click (F2c S2)
        run: cargo xtask screenshot demo target/counter.png -- counter
      - name: screenshot of the boxes demo (F2c S3)
        run: cargo xtask screenshot demo target/boxes.png -- boxes
      - name: screenshot of the shell demo (F2c S4)
        run: cargo xtask screenshot demo target/shell.png -- shell
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: target/*.png
          if-no-files-found: ignore
      # GitHub shows a job that hit its timeout as "cancelled"; this
      # names the timeout and the step that was running.
      - name: report a timeout
        if: cancelled()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_MINUTES: 5
        run: .github/scripts/report-timeout.sh
