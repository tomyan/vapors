# Read-only diagnostic (Tom, 2026-11-23): why #606's host tier fails on the
# hosted runner with "bwrap: loopback: Failed RTM_NEWADDR: Operation not
# permitted" (run 45142856208, job 137584860693). Nothing here changes a
# kernel, AppArmor or permission setting: sudo is used only to read
# (aa-status, the kernel log). It installs bubblewrap, as the ci job does.
# Each case prints its exit status; the job records, it does not judge.
# This branch has no PR and is not for merging.
name: diag-userns

on:
  push:
    branches: [diag/host-userns]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  userns:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: image and kernel
        run: |
          uname -a
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo "ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset}"
      - name: namespace and AppArmor sysctls
        run: |
          for name in kernel/apparmor_restrict_unprivileged_userns \
                      kernel/apparmor_restrict_unprivileged_unconfined \
                      kernel/unprivileged_userns_clone \
                      kernel/unprivileged_userns_apparmor_policy \
                      user/max_user_namespaces; do
            if [ -r "/proc/sys/$name" ]; then
              echo "$name = $(cat "/proc/sys/$name")"
            else
              echo "$name: absent"
            fi
          done
          echo "this shell's AppArmor label: $(cat /proc/self/attr/current 2>&1)"
      - name: install bubblewrap
        run: sudo apt-get install -y -q bubblewrap >/dev/null && bwrap --version && ls -l "$(command -v bwrap)"
      - name: AppArmor profiles (read only)
        run: |
          sudo aa-status 2>&1 | head -5
          echo "--- loaded profiles naming bwrap, unprivileged_userns or unconfined:"
          sudo aa-status 2>&1 | grep -E 'bwrap|unprivileged_userns|unconfined' || echo "(none)"
          echo "--- /etc/apparmor.d entries naming bwrap or userns:"
          ls /etc/apparmor.d | grep -Ei 'bwrap|userns' || echo "(none)"
          echo "--- extra profiles shipped but not loaded:"
          ls /usr/share/apparmor/extra-profiles 2>/dev/null | grep -Ei 'bwrap|userns' || echo "(none)"
          echo "--- bubblewrap package files under apparmor:"
          dpkg -L bubblewrap | grep -i apparmor || echo "(none)"
      - name: reproductions
        run: |
          set +e  # each case reports its own status
          date -u +%Y-%m-%dT%H:%M:%S > "$RUNNER_TEMP/since"
          sleep 1
          try() {
            local label=$1; shift
            local out; out=$("$@" 2>&1); local status=$?
            echo "[$label] exit $status: ${out:-(no output)}"
          }
          try "bwrap, user namespace only" bwrap --ro-bind / / true
          try "bwrap --unshare-user" bwrap --unshare-user --ro-bind / / true
          try "bwrap --unshare-net" bwrap --unshare-net --ro-bind / / true
          try "bwrap --unshare-all" bwrap --unshare-all --ro-bind / / true
          try "bwrap, the host tier's flags" bwrap --unshare-all --die-with-parent --new-session \
            --clearenv --setenv PATH /usr/bin:/bin --ro-bind /usr /usr --symlink usr/bin /bin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev true
          try "unshare -Ur (util-linux, no bwrap)" unshare -Ur true
          try "unshare -Urn, loopback up" unshare -Urn ip link set lo up
      - name: kernel log since the reproductions (read only)
        if: always()
        run: |
          since=$(cat "$RUNNER_TEMP/since")
          echo "--- AppArmor and audit lines since $since:"
          sudo journalctl -k --since "$since" --no-pager 2>&1 | grep -Ei 'apparmor|audit|userns|denied' || echo "(none)"
          echo "--- dmesg AppArmor lines (whole boot, last 20):"
          sudo dmesg 2>&1 | grep -i apparmor | tail -20 || echo "(none)"
