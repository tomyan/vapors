[package]
name = "vapors-perf"
description = "The timing harness: the IU1 workloads through an app's frame, timed per phase in a release build, with their counts (docs/perf)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wgpu.workspace = true
pollster.workspace = true
tracing.workspace = true
vapors-app = { workspace = true, features = ["complex-script-breaks", "grid"] }
vapors-dom.workspace = true
vapors-elements = { workspace = true, features = ["complex-script-breaks", "grid"] }
vapors-gpu-harness.workspace = true
vapors-platform.workspace = true
vapors-racer = { path = "../racer" }
vapors-renderer.workspace = true
vapors-scene.workspace = true
vapors-signals.workspace = true
vapors-text = { workspace = true, features = ["complex-script-breaks"] }
stats_alloc.workspace = true

# The memory harness has its own binary: its counting allocator would
# slow every timed run of vapors-perf.
[[bin]]
name = "vapors-perf"
path = "src/main.rs"

[[bin]]
name = "vapors-perf-memory"
path = "src/memory_main.rs"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
vapors-compiler.workspace = true

# Linux only: instruction counts come from perf events (src/instructions.rs).
[target.'cfg(target_os = "linux")'.dependencies]
perf-event2 = "0.7.4"

[lints]
workspace = true
