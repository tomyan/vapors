[package]
name = "vapors-elements-corpus"
description = "Layout fixtures as .wisp files, with Chromium's boxes for each: the oracle vapors-elements' layout is checked against."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vapors-dom.workspace = true
vapors-signals.workspace = true
vapors-elements = { workspace = true, features = ["complex-script-breaks", "grid"] }
vapors-text = { workspace = true, features = ["complex-script-breaks"] }
vapors-devtools.workspace = true
vapors-components.workspace = true
serde_json = "=1.0.154"
# The oracles' work directory (oracle_files.rs).
tempfile.workspace = true

[dev-dependencies]
vapors-platform.workspace = true
vapors-canvas = { workspace = true, features = ["complex-script-breaks"] }
wgpu.workspace = true
vapors-app = { workspace = true, features = ["complex-script-breaks"] }
vapors-renderer.workspace = true
vapors-scene.workspace = true
vapors-gpu-harness.workspace = true

[build-dependencies]
vapors-compiler.workspace = true

[lints]
workspace = true
