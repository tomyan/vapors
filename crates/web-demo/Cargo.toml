[package]
name = "vapors-web-demo"
description = "The demos page: each F2c slice's demo at ?demo=<name>, the image app at ?demo=image, and an index without a query. Built with trunk by `cargo xtask web`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vapors-racer = { path = "../racer" }
vapors-one-scene.workspace = true
vapors-app = { workspace = true, features = ["complex-script-breaks"] }
vapors-demos.workspace = true
vapors-canvas = { workspace = true, features = ["complex-script-breaks"] }
vapors-platform.workspace = true
vapors-renderer.workspace = true
vapors-scene.workspace = true
wgpu.workspace = true

# The wake demo's export, which the page's script calls.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.129"

[lints]
workspace = true
