[package]
name = "vapors-platform"
description = "Windows, surfaces and input from the operating system: winit on desktop, the canvas on the web."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wgpu.workspace = true
winit.workspace = true
vapors-gpu.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.106", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Window",
] }

[dev-dependencies]
png.workspace = true
vapors-canvas.workspace = true
vapors-scene.workspace = true
vapors-renderer.workspace = true
vapors-gpu-harness.workspace = true

[lints]
workspace = true
