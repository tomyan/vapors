[package]
name = "vapors-platform"
description = "Windows, surfaces and input from the operating system: winit on desktop, the canvas on the web."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wgpu.workspace = true
winit.workspace = true
vapors-gpu.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true
log = "0.4"

# The system file dialog. On Linux the XDG desktop portal over D-Bus,
# which rfd drives itself (no GTK to link, no async runtime); native
# dialogs on macOS and Windows need no feature.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(all(not(target_family = "wasm"), not(target_os = "linux")))'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "Window",
] }

[dev-dependencies]
png.workspace = true
vapors-canvas.workspace = true
vapors-scene.workspace = true
vapors-renderer.workspace = true
vapors-gpu-harness.workspace = true

[lints]
workspace = true
