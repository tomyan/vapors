[package]
name = "vapors-elements"
description = "The element tree: implements Dom over HTML elements with CSS styles, Taffy layout, hit testing and paint to a scene."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# `complex-script-breaks` (default): vapors-text's, forwarded so an app
# can turn it off (crates/text/Cargo.toml).
# `grid` (default): CSS grid layout (taffy's grid), about 54 KiB of brotli
# wasm in touché's page (docs/design/text-stack-size.md). Without it,
# `display: grid` and the grid properties are refused, naming it.
[features]
default = ["complex-script-breaks", "grid"]
complex-script-breaks = ["vapors-text/complex-script-breaks"]
grid = ["taffy/grid"]

[dependencies]
vapors-dom.workspace = true
vapors-css.workspace = true
vapors-scene.workspace = true
vapors-text.workspace = true
taffy.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
vapors-signals.workspace = true
vapors-compiler-examples.workspace = true
serde_json.workspace = true

[lints]
workspace = true
