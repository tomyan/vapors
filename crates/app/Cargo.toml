[package]
name = "vapors-app"
description = "Runs a vapors-elements Document in a window or on the web canvas: the scene painter (quads and text, in order) and the platform App."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# `complex-script-breaks` (default): vapors-text's, forwarded so an app
# can turn it off (crates/text/Cargo.toml).
[features]
default = ["complex-script-breaks", "grid"]
complex-script-breaks = ["vapors-text/complex-script-breaks", "vapors-elements/complex-script-breaks"]
# vapors-elements' CSS grid, forwarded so an app can turn it off
grid = ["vapors-elements/grid"]

[dependencies]
wgpu.workspace = true
vapors-scene.workspace = true
vapors-renderer.workspace = true
vapors-text.workspace = true
vapors-css.workspace = true
vapors-dom.workspace = true
vapors-platform.workspace = true
vapors-elements.workspace = true
tracing.workspace = true

# The loop's waker behind a std::task::Waker for GPU error scopes
# (elements_app_scope_wake.rs): on the web vapors_platform::Waker is not Send.
# wasm-bindgen-futures (as vapors-platform's) drives an unresolved scope
# on the page's task queue (painter_surface_scope_watch.rs).
[target.'cfg(target_family = "wasm")'.dependencies]
send_wrapper = "=0.6.0"
wasm-bindgen-futures = "0.4.79"

[dev-dependencies]
png.workspace = true
vapors-demos.workspace = true
vapors-pixels.workspace = true
vapors-canvas = { workspace = true, features = ["complex-script-breaks"] }
vapors-gpu-harness.workspace = true
vapors-shapes.workspace = true

[lints]
workspace = true
