[package]
name = "xtask"
description = "Factory commands for this workspace. Run as `cargo xtask`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
png.workspace = true
# Pinned: it parses `tailscale status --json`, and a parser change is a deliberate bump.
# preserve_order: mapping keys keep the file's order, so the gate runs
# jobs and steps in the order ci.yml lists them, not sorted.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# Pinned: it reads .github/workflows/ci.yml for `cargo xtask gate`; a
# parser change is a deliberate bump. Maintained, pure Rust (serde_yaml,
# archived, pulled in unsafe-libyaml, RUSTSEC-2024-0449).
yaml-rust2 = { version = "=0.13.0", default-features = false }
# Precompressing the release page for `cargo xtask serve` (precompress.rs):
# brotli and gzip copies beside each file, served by static-web-server.
brotli = { version = "9.1.0", default-features = false, features = ["std"] }
flate2 = "1.1.10"

[lints]
workspace = true
