[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomyan/vapors"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "1"
winit = "0.30"
png = "0.18"
vapors-scene = { path = "crates/scene" }
vapors-gpu = { path = "crates/gpu" }
vapors-gpu-harness = { path = "crates/gpu-harness" }
vapors-renderer = { path = "crates/renderer" }
vapors-platform = { path = "crates/platform" }
vapors-canvas = { path = "crates/canvas" }
vapors-text = { path = "crates/text" }
vapors-css = { path = "crates/css" }
vapors-signals = { path = "crates/signals" }
vapors-dom = { path = "crates/dom" }
vapors-compiler = { path = "crates/compiler" }
vapors-elements = { path = "crates/elements" }
vapors-app = { path = "crates/app" }
vapors-elements-corpus = { path = "crates/elements-corpus" }
vapors-demos = { path = "crates/demos" }
# Pinned exactly: layout results are pinned by the Chromium geometry
# corpus (docs/F2c.md), and a Taffy bump is a deliberate change checked
# against it. Only the algorithms vapors uses: no TaffyTree, no floats.
taffy = { version = "=0.15.0", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "calc", "content_size"] }
# Pinned exactly: the compiler's output is formatted by prettyplease and
# must parse with the same syn; a drift changes generated code and snapshots.
syn = { version = "=3.0.9", features = ["full", "visit", "visit-mut", "printing", "extra-traits", "parsing"] }
prettyplease = "=0.3.0"
quote = "=1.0.47"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
insta = "=1.49.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
