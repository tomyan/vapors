[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tomyan/vapors"
rust-version = "1.99"

[workspace.dependencies]
# Test scratch directories that delete themselves; /tmp is a tmpfs whose
# inodes ran out on 2026-11-02.
tempfile = "3.27.0"
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "1"
# winit's default features, except Wayland's client-side decorations
# without their title text (`-notitle`): the titled variant pulls in
# ab_glyph and ttf-parser, which is unmaintained (RUSTSEC-2026-0192). On a
# compositor that draws no decorations itself, such as GNOME, the frame
# is drawn without a title (touche DESIGN.md, 2. Tech stack, platform notes).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
png = "0.18"
vapors-scene = { path = "crates/scene" }
vapors-shapes = { path = "crates/shapes" }
vapors-scene3d = { path = "crates/scene3d" }
vapors-scene3d-gpu = { path = "crates/scene3d-gpu" }
vapors-scene3d-components = { path = "crates/scene3d-components" }
# Counting global allocator for vapors-perf-memory's live heap bytes
# (finish-line property 8): the workspace forbids unsafe code, and a
# global allocator is an unsafe impl. Pinned exactly: the counts it keeps
# are what the memory records read.
stats_alloc = "=0.1.10"
# Matrix maths for the 3D scene (docs/plans/3d-2.md, decision 3).
glam = "=0.34.3"
vapors-gpu = { path = "crates/gpu" }
vapors-gpu-harness = { path = "crates/gpu-harness" }
vapors-renderer = { path = "crates/renderer" }
vapors-platform = { path = "crates/platform" }
vapors-canvas = { path = "crates/canvas", default-features = false }
# vapors-text, -elements, -canvas and -app without default features: each
# library forwards `complex-script-breaks` (default on), and the leaf
# crates turn it on, so an app can turn it off (crates/text/Cargo.toml
# says what that costs).
vapors-text = { path = "crates/text", default-features = false }
# Pinned exactly: vapors-shapes parses path data into zeno's commands and
# vapors-text strokes them, so the two must be one zeno; and the
# rasteriser's output is what the comparison page signed off.
zeno = { version = "=0.3.3", default-features = false, features = ["std", "eval"] }
vapors-css = { path = "crates/css" }
vapors-signals = { path = "crates/signals" }
vapors-dom = { path = "crates/dom" }
vapors-a11y = { path = "crates/a11y" }
vapors-compiler = { path = "crates/compiler" }
vapors-components = { path = "crates/components" }
vapors-elements = { path = "crates/elements", default-features = false }
vapors-app = { path = "crates/app", default-features = false }
vapors-elements-corpus = { path = "crates/elements-corpus" }
vapors-demos = { path = "crates/demos" }
vapors-pixels = { path = "crates/pixels" }
vapors-devtools = { path = "crates/devtools" }
vapors-compiler-examples = { path = "crates/compiler-examples" }
# FxHasher for the maps keyed by NodeId, slot keys and text keys on the
# update's hot paths: SipHash was about 5 ms of a 21.6 ms edit paint at
# 3000 rows (docs/perf/baseline-2026-11-10.md, "IU3 3c-2"). FxHasher is
# unseeded; the keys are node ids, slots and the document's text runs.
rustc-hash = "2.1"
# Pinned exactly: layout results are pinned by the Chromium geometry
# corpus (docs/F2c.md), and a Taffy bump is a deliberate change checked
# against it. Only the algorithms vapors uses: no TaffyTree, no floats.
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "block_layout", "calc", "content_size"] }
# Pinned exactly: the compiler's output is formatted by prettyplease and
# must parse with the same syn; a drift changes generated code and snapshots.
syn = { version = "=3.0.9", features = ["full", "visit", "visit-mut", "printing", "extra-traits", "parsing"] }
prettyplease = "=0.3.0"
quote = "=1.0.47"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
insta = "=1.49.0"
# The a11y driver's Command and Reply (vapors-elements `a11y_drive`) travel
# over stdio, a socket and a page call.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The DevTools protocol is a WebSocket (vapors-devtools); the client only.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Debug builds keep file and line for panics and backtraces but drop the
# full DWARF, which is most of a debug target's size: touche's measurements
# in its #44 (26 GB to 8.7 GB for a full build).
[profile.dev]
debug = "line-tables-only"

# Test builds only: the 3000-row kept_shift tests spend their time in
# debug-build code and hit nextest's 60 s limit under load; measured in the PR.
[profile.test]
opt-level = 1
