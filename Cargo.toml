[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomyan/vapors"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "1"
winit = "0.30"
png = "0.18"
vapors-scene = { path = "crates/scene" }
vapors-gpu = { path = "crates/gpu" }
vapors-gpu-harness = { path = "crates/gpu-harness" }
vapors-renderer = { path = "crates/renderer" }
vapors-platform = { path = "crates/platform" }
vapors-canvas = { path = "crates/canvas" }
vapors-text = { path = "crates/text" }
vapors-css = { path = "crates/css" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
